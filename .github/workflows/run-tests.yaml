# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Node.js CI

on: [push, pull_request]

jobs:
  unittests:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: |
          make test

  audit_prod:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Uses builtin `npm audit` instead of audit-ci. Note: npm audit has no
      # allowlist. To suppress a false-positive advisory, either raise
      # --audit-level or restore audit-ci. (audit-ci.json previously allowlisted
      # advisories 1002475, 1002522, serialize-javascript.)
      - name: Audit production npm packages
        run: npm audit --omit=dev --audit-level=moderate

  audit_dev:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit including devDependencies
        # Don't error out on audit warnings about devDependencies
        run: npm audit --audit-level=moderate || true

  linter:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linters
        run: npm run lint

      - name: Run stylelint
        run: npm run stylelint:ci
