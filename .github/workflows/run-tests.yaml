name: Node.js CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  unittests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with: &node-setup
          node-version-file: '.nvmrc'
          check-latest: true
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

  buildtests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with: *node-setup

      - name: Install dependencies
        run: npm ci

      # TODO: Staging and production share build/; investigate output isolation.
      - name: Build release artifacts
        run: |
          npm run build-staging
          npm run build-production

  audit_prod:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with: *node-setup

      # Uses builtin `npm audit` instead of audit-ci. Note: npm audit has no
      # allowlist. To suppress a false-positive advisory, either raise
      # --audit-level or restore audit-ci. (audit-ci.json previously allowlisted
      # advisories 1002475, 1002522, serialize-javascript.)
      - name: Audit production npm packages
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate

  audit_dev:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with: *node-setup

      - name: Audit including devDependencies
        # Don't error out on audit warnings about devDependencies
        run: npm audit --package-lock-only --audit-level=moderate || true

  linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v6
        with: *node-setup

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

      - name: Run stylelint
        run: npm run stylelint
